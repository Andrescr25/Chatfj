name: Respaldo del latido de Render

# El servicio se mantiene despierto por su cuenta: el propio servidor se consulta
# cada 10 minutos (src/app/core/keep_alive.py). Este flujo es el respaldo para el
# único caso que el latido no cubre: si Render llega a dormir el servicio, el
# latido se detiene con él y alguien de afuera tiene que despertarlo.
#
# No sirve como mecanismo principal. Programado cada 10 minutos, entre el 26 de
# agosto y el 10 de setiembre de 2026 disparó en la práctica una vez cada dos
# horas (mediana), y el servicio pasaba dormido la mayor parte del día.

on:
  schedule:
    # Nunca en el minuto 0: GitHub advierte que el inicio de cada hora es el
    # momento de más carga, cuando más se retrasan o descartan ejecuciones.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: # Permite ejecutarlo a mano desde la pestaña Actions

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Sin condición de ejecución a propósito: este repositorio es una bifurcación
    # del institucional, y un `if: !fork` lo dejó saltándose en silencio, que es
    # peor que un ping de más.
    steps:
      - name: Consultar el estado del backend
        env:
          # Se puede sobrescribir con una variable del repositorio (Settings > Variables)
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://chatfj-m63k.onrender.com' }}
        run: |
          set -uo pipefail

          echo "Consultando ${BACKEND_URL}/health"
          inicio_total=$(date +%s)

          # Si el servicio dormía, Render tarda en levantarlo: se espera hasta
          # 90 s y se reintenta antes de darlo por caído.
          for intento in 1 2 3; do
            inicio=$(date +%s)
            # curl ya escribe 000 cuando no logra conectar; el || solo cubre
            # el caso de que ni siquiera llegue a imprimirlo.
            codigo=$(curl --silent --show-error --location \
                          --max-time 90 \
                          --write-out '%{http_code}' \
                          --output /tmp/respuesta.json \
                          "${BACKEND_URL}/health") || codigo="${codigo:-000}"
            duracion=$(( $(date +%s) - inicio ))

            if [ "$codigo" = "200" ]; then
              cat /tmp/respuesta.json
              echo
              total=$(( $(date +%s) - inicio_total ))
              activo=$(jq -r '.segundos_activo // empty' /tmp/respuesta.json 2>/dev/null || true)

              # Proceso recién arrancado y respuesta lenta: estaba dormido y esta
              # consulta lo despertó. Un despliegue reciente también reinicia el
              # proceso, pero responde rápido, así que no se confunde con esto.
              if [ -n "$activo" ] && [ "$activo" -lt 180 ] && [ "$total" -ge 20 ]; then
                echo "::warning title=Backend dormido::Arrancó hace ${activo}s y tardó ${total}s en responder. El latido interno no lo mantuvo despierto."
                echo "### ⚠️ El backend estaba dormido: arrancó hace ${activo}s y tardó ${total}s en responder" >> "$GITHUB_STEP_SUMMARY"
                echo "El latido interno (src/app/core/keep_alive.py) no lo sostuvo. Revise los registros de Render." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi

              echo "✅ Despierto: respondió en ${total}s, activo desde hace ${activo:-?}s"
              echo "### Backend despierto — respondió en ${total}s, activo hace ${activo:-?}s" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "⚠️ Intento ${intento}: HTTP ${codigo} tras ${duracion}s"
            [ "$intento" -lt 3 ] && sleep 20
          done

          echo "❌ El backend no respondió 200 después de 3 intentos."
          echo "### Backend sin respuesta — último código: ${codigo}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
