name: Mantener el backend despierto (horario diurno)

# Render suspende el servicio tras 15 minutos sin tráfico y el primer usuario del
# día paga ese arranque en frío. Este flujo lo mantiene despierto solo mientras
# hay gente usándolo: de 7:00 a 22:00 de Costa Rica. De noche se deja dormir.

on:
  schedule:
    # GitHub Actions programa en UTC. Costa Rica es UTC-6 todo el año (sin horario de verano).
    #
    #   12:50 UTC = 06:50 CR  -> calentamiento previo a la apertura
    #   13:00–23:50 UTC       -> 07:00–17:50 CR
    #   00:00–03:50 UTC       -> 18:00–21:50 CR
    #
    # Último ping del día: 21:50 CR. Entre las 22:00 y las 6:50 el servicio duerme.
    - cron: '50 12 * * *'
    - cron: '*/10 13-23,0-3 * * *'
  workflow_dispatch: # Permite ejecutarlo a mano desde la pestaña Actions

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # En una bifurcación del repositorio no tiene sentido: duplicaría los pings
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Consultar el estado del backend
        env:
          # Se puede sobrescribir con una variable del repositorio (Settings > Variables)
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://chatfj-m63k.onrender.com' }}
        run: |
          set -uo pipefail

          echo "Consultando ${BACKEND_URL}/health"

          # El primer ping del día puede tardar mientras Render levanta el
          # contenedor: se espera hasta 90 s y se reintenta antes de dar por
          # caído el servicio.
          for intento in 1 2 3; do
            inicio=$(date +%s)
            # curl ya escribe 000 cuando no logra conectar; el || solo cubre
            # el caso de que ni siquiera llegue a imprimirlo.
            codigo=$(curl --silent --show-error --location \
                          --max-time 90 \
                          --write-out '%{http_code}' \
                          --output /tmp/respuesta.json \
                          "${BACKEND_URL}/health") || codigo="${codigo:-000}"
            duracion=$(( $(date +%s) - inicio ))

            if [ "$codigo" = "200" ]; then
              echo "✅ Respondió 200 en ${duracion}s"
              cat /tmp/respuesta.json
              echo
              echo "### Backend despierto — HTTP 200 en ${duracion}s" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "⚠️ Intento ${intento}: HTTP ${codigo} tras ${duracion}s"
            [ "$intento" -lt 3 ] && sleep 20
          done

          echo "❌ El backend no respondió 200 después de 3 intentos."
          echo "### Backend sin respuesta — último código: ${codigo}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
