# Configuración para Render
services:
  # Backend API
  - type: web
    name: chat-fj-api
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Cascada de modelos: si el primero se queda sin cupo, responde el siguiente
      - key: LLM_CHAIN
        value: groq,huggingface,gemini
      # Respaldo: usa el mismo token de HuggingFace de los embeddings
      - key: HUGGINGFACE_CHAT_MODEL
        value: zai-org/GLM-5.2

      # Índice vectorial real del proyecto (serverless, 1024 dimensiones)
      - key: EMBEDDING_MODEL_NAME
        value: intfloat/multilingual-e5-large
      - key: PINECONE_ENV
        value: us-east-1
      - key: PINECONE_INDEX_NAME
        value: legal-index
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: PINECONE_API_KEY
        sync: false

      # Panel de administración
      # Correos con acceso de administración garantizado (respaldo ante pérdida de rol)
      - key: ADMIN_EMAILS
        sync: false
      # Opcional: bucket para guardar los archivos originales de los documentos.
      # Sin él se usa el disco del contenedor, que Render borra en cada despliegue.
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      # Dominios adicionales permitidos por CORS, separados por coma
      - key: EXTRA_CORS_ORIGINS
        sync: false

    
  # Frontend
  - type: web
    name: chat-fj-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: chat-fj-api
          property: url
